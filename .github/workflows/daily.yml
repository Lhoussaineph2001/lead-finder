name: Find agencies

on:
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC = 05:00 Morocco, before the Apps Script runs at 07:00
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to commit the new candidates file

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Discover agencies
        run: |
          python find_agencies.py \
            --sources search,overpass \
            --queries 60 \
            --per-query 15 \
            --pause 3

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates/
          git diff --staged --quiet || git commit -m "candidates: $(date -u +%F)"
          git push
